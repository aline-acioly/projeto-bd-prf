# Sistema de Avaliação PRF — banco, pgAdmin, API e frontend
# Subir tudo:  docker compose up -d --build
# Frontend:    http://localhost:8080
# API:         http://localhost:8000  (documentação em http://localhost:8000/docs)
# pgAdmin:     http://localhost:16543  (login abaixo)
# No pgAdmin o servidor "PRF" já vem cadastrado (pgadmin/servers.json), sem pedir senha.
# Recriar o banco do zero (re-executa db/init/*.sql): docker compose down -v && docker compose up -d --build

services:
  postgres:
    image: postgres:16
    container_name: prf-postgres
    environment:
      POSTGRES_USER: prf
      POSTGRES_PASSWORD: prf123
      POSTGRES_DB: avaliacao_prf
    ports:
      - "15432:5432"          # do seu PC: localhost:15432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # schema, triggers e seed rodam na 1ª subida
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prf -d avaliacao_prf"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: prf-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@prf.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      # Modo servidor (com login). Na 1ª subida, o entrypoint da imagem importa este arquivo
      # para o usuário acima: o servidor "PRF" já aparece cadastrado.
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgpass-prf:ro
    # O servers.json aponta "passfile": "/pgpass", que no modo servidor fica na pasta do usuário
    # (storage/admin_prf.com). A libpq só aceita o arquivo com permissão 600 e do próprio usuário,
    # o que um bind mount do Windows/macOS não garante: por isso ele é copiado antes de iniciar.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mkdir -p -m 700 /var/lib/pgadmin/storage/admin_prf.com &&
        cp /pgpass-prf /var/lib/pgadmin/storage/admin_prf.com/pgpass &&
        chmod 600 /var/lib/pgadmin/storage/admin_prf.com/pgpass &&
        exec /entrypoint.sh
    ports:
      - "16543:80"
    depends_on:
      - postgres

  backend:
    build: ./backend
    container_name: prf-backend
    environment:
      # Dentro da rede do compose o banco é o host "postgres", na porta interna 5432.
      DATABASE_URL: postgresql://prf:prf123@postgres:5432/avaliacao_prf
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy   # espera o pg_isready, e não só o container subir

  frontend:
    build:
      context: ./frontend
      args:
        # Endereço da API visto pelo navegador (no PC), não de dentro da rede do compose.
        VITE_API_URL: http://localhost:8000
    container_name: prf-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
