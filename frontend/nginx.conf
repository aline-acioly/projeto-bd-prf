server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do React Router (/pacientes/10000000001, /relatorios...) não são arquivos:
    # devolve o index.html e o roteamento acontece no navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os arquivos de assets/ têm hash no nome, então podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
